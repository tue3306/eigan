name: ci

# Portão de qualidade em Windows e Linux: formatação, lint, tipos e testes.
# Tudo offline: os testes sobem servidores locais e nunca tocam a internet.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: testes (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Formatação (ruff format)
        run: python -m ruff format --check src tests packaging
      - name: Lint (ruff)
        run: python -m ruff check src tests packaging
      - name: Tipos (mypy)
        run: python -m mypy src
      - name: Testes (pytest)
        run: python -m pytest -q

  # O pacote instalado (sem modo editável) precisa rodar de qualquer pasta.
  instalacao:
    name: instalação limpa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Instalar o pacote
        run: python -m pip install .
      - name: Versão e checagens
        working-directory: /tmp
        run: |
          eigan --versao
          eigan checagens > /dev/null
      - name: Auditoria da própria pasta do projeto
        working-directory: /tmp
        run: eigan auditar "$GITHUB_WORKSPACE/src" --tipo projeto --formatos json --saida /tmp/relatorio
