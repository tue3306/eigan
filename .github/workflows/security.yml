# Segurança do próprio EIGAN: SAST (bandit), dependências (pip-audit) e, como
# aviso, semgrep e varredura de segredos. A ferramenta de auditoria se audita.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1" # segunda-feira, varredura semanal

permissions:
  contents: read

jobs:
  sast-sca:
    name: bandit + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Atualizar ferramentas de build
        run: python -m pip install -U pip setuptools
      - name: Instalar
        run: python -m pip install . bandit pip-audit
      - name: Bandit (severidade média ou maior bloqueia)
        run: bandit -q -r src --severity-level medium
      - name: pip-audit (dependências de execução)
        run: pip-audit

  # Informativos: os testes trazem segredos falsos de propósito (tests/fixtures)
  # para provar que o EIGAN os encontra, e a base de conhecimento tem exemplos.
  semgrep:
    name: semgrep (aviso)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install semgrep
      - name: Semgrep (python, security-audit)
        run: semgrep --config p/python --config p/security-audit src || true

  gitleaks:
    name: gitleaks (aviso)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
