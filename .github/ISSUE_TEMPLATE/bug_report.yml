name: "Erro no EIGAN"
description: Algo no EIGAN não funcionou como esperado (não use para vulnerabilidades do próprio EIGAN).
labels: ["bug", "triagem"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar. **Encontrou uma vulnerabilidade no próprio EIGAN?**
        Não abra issue pública: siga o [SECURITY.md](../security/policy).
  - type: checkboxes
    id: preflight
    attributes:
      label: Antes de enviar
      options:
        - label: Procurei issues abertas e não encontrei uma igual.
          required: true
        - label: Não incluí endereços de terceiros, senhas, tokens ou dados pessoais.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: O que aconteceu?
      description: O que você fez, o que esperava e o que viu.
      placeholder: Ao auditar uma pasta de projeto pelo painel, esperava X mas apareceu Y.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Como reproduzir
      description: Passos ou comando exato. Use apenas alvos locais ou que você administra.
      placeholder: |
        eigan auditar ./meu-projeto --tipo projeto
      render: shell
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Trecho do log
      description: O caminho do log aparece na tela "Sobre" do painel. Revise antes de colar.
      render: text
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Versão do EIGAN
      placeholder: "saída de: eigan --versao"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Sistema
      placeholder: "Ex.: Windows 11 com o executável, Ubuntu 24.04 com pip"
    validations:
      required: true
