name: "Sugestão de checagem ou melhoria"
description: Sugerir uma nova checagem de segurança, um relatório ou uma melhoria no painel.
labels: ["melhoria"]
body:
  - type: markdown
    attributes:
      value: |
        Uma checagem nova precisa ser **não intrusiva** (observar, nunca explorar) e vir com
        a explicação de como corrigir. Veja [docs/escrevendo-checagens.md](../blob/main/docs/escrevendo-checagens.md).
  - type: dropdown
    id: kind
    attributes:
      label: Tipo
      options:
        - Nova checagem
        - Explicação ou correção de uma checagem existente
        - Relatório (HTML, PDF, JSON, SARIF, CSV)
        - Painel ou linha de comando
        - Documentação
        - Outro
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: ["Site ou aplicação web", "Servidor ou rede", "Esta máquina", "Pasta de projeto", "Logs", "Geral"]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Que risco isso ajuda a encontrar ou corrigir?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Como detectar (sem explorar), como corrigir e fontes de referência (CIS, OWASP, documentação oficial).
    validations:
      required: true
